[project]
name = "gate-switch"
version = "2.0.3"
description = "Dependency-free macOS channel switcher for Codex, OpenCode and Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
sgate = "sgate:main"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["test_sgate.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
py-modules = ["sgate"]
